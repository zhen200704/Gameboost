
name: Build GameBoostT606 APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Set up Java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Find or extract Android project
      - name: Prepare project
        shell: bash
        run: |
          if [ -f "GameBoostT606/settings.gradle.kts" ]; then
            PROJECT_DIR="GameBoostT606"
          elif [ -f "settings.gradle.kts" ]; then
            PROJECT_DIR="."
          else
            ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: Android project or ZIP file not found."
              exit 1
            fi

            mkdir -p extracted
            unzip -q "$ZIP_FILE" -d extracted

            if [ -f "extracted/GameBoostT606/settings.gradle.kts" ]; then
              PROJECT_DIR="extracted/GameBoostT606"
            elif [ -f "extracted/settings.gradle.kts" ]; then
              PROJECT_DIR="extracted"
            else
              echo "ERROR: settings.gradle.kts not found."
              exit 1
            fi
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found in: $PROJECT_DIR"

      # 4. Set up Android SDK without setup-android action
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          if [ ! -d "$SDK" ]; then
            echo "ERROR: Android SDK not found at $SDK"
            exit 1
          fi

          SDKMANAGER=$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      # 5. Set up Gradle
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # 6. Build APK
      - name: Build Debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      # 7. Check APK exists
      - name: Verify APK
        shell: bash
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          ls -lh "$APK"

      # 8. Upload APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameBoostT606-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # 9. Publish release when using a version tag
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: GameBoostT606 ${{ github.ref_name }}
          files: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
          
